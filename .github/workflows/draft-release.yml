name: draft-release

on:
  workflow_dispatch:
    inputs:
      version-tag:
        description: |
          Semantic version tag for next release.
          If not provided, it will be determined based on conventional commit history.
          Example: v2.5.11
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    # optional: run in the ccbr_actions image (built for each release tag) to skip
    # installing python/R/ccbr_actions -- omit `container` to install them via pip instead.
    # do NOT set `container` if this repo is an R package (i.e. has a DESCRIPTION file):
    # setup-r-dependencies installs both cffr and your package's own DESCRIPTION
    # dependencies, but the container only has cffr preinstalled.
    container: nciccbr/ccbr_actions:latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # required to include tags
      - uses: CCBR/actions/draft-release@v0.8.0
        with:
          github-token: ${{ github.token }}
          version-filepath: _extensions/version-selector/VERSION
          version-tag: ${{ github.event.inputs.version-tag }}
      # The action only commits VERSION; mirror it into _extension.yml on the draft
      # branch and point the draft release at the new commit.
      - name: Sync extension version
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_BRANCH: release-draft
        run: |
          git fetch origin "$DRAFT_BRANCH"
          git switch "$DRAFT_BRANCH" 2>/dev/null || git switch -c "$DRAFT_BRANCH" "origin/$DRAFT_BRANCH"
          git reset --hard "origin/$DRAFT_BRANCH"
          # the script exits 1 after rewriting the file, and on errors
          if python .github/scripts/sync_extension_version.py; then
            echo "_extension.yml already matches VERSION"
            exit 0
          fi
          if git diff --quiet -- _extensions/version-selector/_extension.yml; then
            echo "::error::sync_extension_version.py failed without updating _extension.yml"
            exit 1
          fi
          version="$(tr -d '[:space:]' < _extensions/version-selector/VERSION)"
          git add _extensions/version-selector/_extension.yml
          git commit -m "chore: 🤖 sync _extension.yml version to ${version}"
          git push origin "$DRAFT_BRANCH"
          gh release edit "v${version}" --target "$(git rev-parse HEAD)" --repo "$GITHUB_REPOSITORY"
