name: "deploy-version"
description: "Render a Quarto website and deploy it to a version subfolder of the docs branch."
author: "CCBR"
inputs:
  github-token:
    description: "GitHub Actions token (e.g. secrets.GITHUB_TOKEN)."
    required: true
  version-selector-version:
    description: "Git ref of CCBR/quarto-version-selector to pip install."
    required: true
    default: "main"
  python-version:
    description: "The version of Python to install."
    required: true
    default: "3.14"
  docs-branch:
    description: "The branch to deploy the docs website to."
    required: true
    default: "gh-pages"
  github-actor:
    description: "Username of GitHub actor for the git commit when the docs branch is deployed."
    required: true
    default: "41898282+github-actions[bot]"
  strict-semver:
    description: "Whether release tags must follow strict semantic versioning."
    default: "true"
  dry-run:
    description: "Print the deploy command without deploying."
    default: "false"
  path:
    description: "Path to the Quarto project to render, relative to the repository root (e.g. docs)."
    default: "."
  site-dir:
    description: "Rendered site directory, relative to `path`. Must match the project's `output-dir`."
    default: "_site"
  require-descendant:
    description: "Fail (instead of warn) when the commit does not descend from the latest release."
    default: "false"
outputs:
  version:
    description: "The version of the docs being deployed."
    value: ${{ steps.set-version.outputs.version }}
  alias:
    description: "The alias of the version being deployed."
    value: ${{ steps.set-version.outputs.alias }}
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
    - name: git config
      shell: bash
      run: |
        cd "$GITHUB_WORKSPACE"
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git config --local user.email "${{ inputs.github-actor }}@users.noreply.github.com"
        git config --local user.name "${{ inputs.github-actor }}"
    - name: Install quarto-version-selector
      shell: bash
      run: pip install --upgrade pip "git+https://github.com/CCBR/quarto-version-selector.git@${{ inputs.version-selector-version }}"
    - name: Render site
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.path }}
      run: |
        cd "$GITHUB_WORKSPACE"
        quarto render "$PROJECT_PATH"
    - name: Set version & alias
      id: set-version
      shell: python {0}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        STRICT_SEMVER: ${{ inputs.strict-semver }}
        REQUIRE_DESCENDANT: ${{ inputs.require-descendant }}
        REPO: ${{ github.repository }}
      run: |
        import os
        import warnings

        from quarto_version_selector.versions import get_version_and_alias

        os.chdir(os.environ["GITHUB_WORKSPACE"])
        with warnings.catch_warnings(record=True) as caught:
            warnings.simplefilter("always")
            try:
                version, alias = get_version_and_alias(
                    release_tag=os.environ.get("RELEASE_TAG") or None,
                    strict_semver=os.environ["STRICT_SEMVER"] == "true",
                    repo=os.environ["REPO"],
                    require_descendant=os.environ["REQUIRE_DESCENDANT"] == "true",
                )
            except (ValueError, RuntimeError) as err:
                print(f"::error::{err}")
                raise SystemExit(1) from None
        for warning in caught:
            print(f"::warning::{warning.message}")
        print(f"version={version} alias={alias}")
        with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
            fh.write(f"version={version}\nalias={alias}\n")
    - name: Deploy docs
      shell: bash
      env:
        DRY_RUN: ${{ inputs.dry-run }}
        VERSION: ${{ steps.set-version.outputs.version }}
        ALIAS: ${{ steps.set-version.outputs.alias }}
        DOCS_BRANCH: ${{ inputs.docs-branch }}
        SITE_DIR: ${{ inputs.path }}/${{ inputs.site-dir }}
      run: |
        cd "$GITHUB_WORKSPACE"
        cmd=(quarto-version-selector deploy --version "$VERSION" --site-dir "$SITE_DIR" --branch "$DOCS_BRANCH" --push)
        if [ -n "$ALIAS" ]; then
          cmd+=(--alias "$ALIAS")
          [ "$ALIAS" = "latest" ] && cmd+=(--set-default latest)
        fi
        if [ "$DRY_RUN" = "true" ]; then
          echo "Dry run, not deploying the docs: ${cmd[*]}"
          exit 0
        fi
        "${cmd[@]}"
    # Pushes made with GITHUB_TOKEN do not trigger a GitHub Pages build, so request one.
    # Requires `pages: write`; skipped with a warning if Pages is not configured yet.
    - name: Request GitHub Pages build
      if: ${{ inputs.dry-run != 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
      run: |
        if ! gh api --method POST "repos/$REPO/pages/builds" --silent; then
          echo "::warning::Could not request a GitHub Pages build. Configure Pages to publish from the docs branch and grant the workflow 'pages: write'."
        fi
